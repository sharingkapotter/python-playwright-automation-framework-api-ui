name: Test Automation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC daily (01:00 America/Chicago)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke — deployed environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install browser
        run: playwright install --with-deps chromium

      - name: Run smoke tests
        run: pytest -m smoke --env prod

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            reports/
            test-results/
          retention-days: 14

  regression:
    name: Regression — hermetic build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui-testing-showcase/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the application
        working-directory: ui-testing-showcase
        run: |
          npm ci
          npm run build

      - name: Serve the application
        working-directory: ui-testing-showcase
        run: |
          nohup npm run preview -- --port 4173 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173 > /dev/null && exit 0
            sleep 1
          done
          echo "Application failed to start"; cat preview.log; exit 1

      - name: Install test dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run full suite
        run: pytest --env preview -n auto --video=retain-on-failure

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: |
            reports/
            test-results/
          retention-days: 30