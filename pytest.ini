[pytest]
testpaths = tests
pythonpath = .

addopts =
    --strict-markers
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --junitxml=reports/junit.xml
    --durations=10
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: fast critical-path checks, run on every commit
    regression: full functional coverage, run before release
    negative: invalid input and failure-path scenarios
    flaky: known-unstable, quarantined and tracked for remediation
    api: API and backend-service tests

